services:
  memoscape:
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile
    image: memoscape-self-hosted:latest
    container_name: memoscape
    restart: unless-stopped
    expose:
      - "3000"
    command: ["corepack", "pnpm", "exec", "wrangler", "dev", "--config", "dist/server/wrangler.json", "--var", "TENCENT_SES_ENDPOINT:http://ses-proxy:8788/", "--var", "TENCENT_LIGHTCOS_PROXY_ENDPOINT:http://ses-proxy:8788/cos", "--ip", "0.0.0.0", "--port", "3000", "--persist-to", "/data", "--show-interactive-dev-session", "false"]
    depends_on:
      ses-proxy:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./secrets.dev.vars:/app/dist/server/.dev.vars:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok&&r.status!==302)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ses-proxy:
    image: memoscape-self-hosted:latest
    container_name: memoscape-ses-proxy
    restart: unless-stopped
    command: ["node", "/app/deploy/self-hosted/ses-proxy.mjs"]
    env_file:
      - ./secrets.dev.vars
    expose:
      - "8788"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>验证注册邮箱</title>
  </head>
  <body style="margin:0;background:#f4f1e8;color:#07100c;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f1e8;">
      <tr>
        <td align="center" style="padding:36px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border:1px solid #c9c5ba;background:#faf8f1;">
            <tr>
              <td style="padding:28px 32px;background:#07100c;color:#f4f1e8;">
                <div style="font-size:12px;letter-spacing:2px;">MEMOSCAPELAB</div>
                <div style="margin-top:7px;color:#95b4a4;font-size:11px;">EMAIL VERIFICATION / 邮箱验证</div>
              </td>
            </tr>
            <tr>
              <td style="padding:34px 32px;">
                <h1 style="margin:0 0 16px;font-size:24px;font-weight:500;">验证您的注册邮箱</h1>
                <p style="margin:0;color:#4f5752;font-size:14px;line-height:1.8;">请输入以下验证码完成注册。验证码在 30 分钟内有效。</p>
                <div style="margin:28px 0;padding:18px;border:1px solid #315e49;background:#eef1ea;color:#173c2e;font-family:Consolas,monospace;font-size:30px;font-weight:bold;letter-spacing:8px;text-align:center;">{{code}}</div>
                <p style="margin:0;color:#777d79;font-size:12px;line-height:1.8;">如果不是您本人操作，请忽略这封邮件。请勿把验证码转发给他人。</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
